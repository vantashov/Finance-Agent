<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Финансы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--tx:#111113;--hint:#6b6b73;--ac:#1c1c1e;--act:#fff;--in:#12c262;--bad:#ff3b30;--warn:#ff9f0a;--ok:#2fc48d;--glass:rgba(255,255,255,.55);--edge:rgba(255,255,255,.85);--hi:rgba(255,255,255,.95);--sh:rgba(0,0,0,.13);--field:rgba(255,255,255,.6);--line:rgba(0,0,0,.1);--bg:#e9e9ec;--b1:#ffffff;--b2:#c4c4ca;--b3:#dcdce0}
[data-theme=dark]{--tx:#f5f5f7;--hint:#9a9aa2;--ac:#f2f2f7;--act:#111113;--in:#5af5a0;--bad:#ff6961;--warn:#ffb340;--ok:#41d6a0;--glass:rgba(42,42,46,.45);--edge:rgba(255,255,255,.14);--hi:rgba(255,255,255,.24);--sh:rgba(0,0,0,.55);--field:rgba(255,255,255,.07);--line:rgba(255,255,255,.1);--bg:#0a0a0b;--b1:#2c2c30;--b2:#3b3b41;--b3:#1c1c1f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.4 system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;background:var(--bg);background-image:radial-gradient(55% 38% at 12% 8%,var(--b1),transparent 70%),radial-gradient(50% 36% at 92% 28%,var(--b2),transparent 70%),radial-gradient(60% 45% at 35% 100%,var(--b3),transparent 70%);background-attachment:fixed}
main{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px 120px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
[hidden]{display:none!important}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--edge);box-shadow:0 10px 32px var(--sh),inset 0 1px 0 var(--hi);border-radius:26px}
header{padding:10px 12px 14px;margin-bottom:14px}
.mo{display:flex;align-items:center;justify-content:space-between}
.mo button{font-size:26px;width:44px;height:44px;border-radius:50%}
h1{font-size:17px;margin:0;font-weight:600;text-transform:capitalize}
.bal{text-align:center;padding:6px 0 2px}
.bal .lb{display:block;color:var(--hint);font-size:14px}
.bal b{font-size:44px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bal b.neg{color:var(--bad)}
.sm{display:flex;justify-content:center;gap:22px;color:var(--hint);font-size:14px}
.sm b{color:var(--tx);font-variant-numeric:tabular-nums}
.sm #inc{color:var(--in)}
.card{padding:14px;margin-bottom:14px}
input,select{width:100%;background:var(--field);border:1px solid var(--edge);border-radius:16px;padding:12px 14px;box-shadow:inset 0 1px 2px var(--line)}
.add{display:flex;gap:8px;margin-bottom:12px}
.add input[type=date]{width:150px;flex:none}
.pri{background:var(--ac);color:var(--act);border-radius:16px;padding:12px 18px;font-weight:600;box-shadow:0 6px 16px var(--sh)}
#chips{display:flex;flex-wrap:wrap;gap:8px}
#chips button{background:var(--field);border:1px solid var(--edge);border-radius:20px;padding:9px 15px;box-shadow:0 3px 10px var(--sh)}
#chips button:active{background:var(--ac);color:var(--act)}
#chips .link{color:var(--ac);border:0;box-shadow:none;background:none;padding:6px 0}
.hint{color:var(--hint);font-size:14px;min-height:20px;margin:10px 0 0}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 16px;margin-bottom:8px;background:var(--field);border:1px solid var(--edge);border-radius:20px;box-shadow:0 4px 14px var(--sh)}
.item .n{flex:1;min-width:0}
.item .n span{display:block;color:var(--hint);font-size:13px}
.item .a{font-variant-numeric:tabular-nums;font-weight:600}
.item .a.in{color:var(--in);font-weight:700}
.empty{color:var(--hint);padding:22px 0;text-align:center}
.lim{display:flex;align-items:center;gap:10px;padding:6px 0}
.lim label{flex:1;min-width:0}
.lim label span{display:block;color:var(--hint);font-size:13px}
.lim input{width:110px;text-align:right}
.lim .x{width:40px;height:40px;border-radius:50%;color:var(--bad);font-size:22px;flex:none}
.seg{display:flex;gap:4px;padding:4px;margin-bottom:14px;max-width:260px;border-radius:20px}
.seg button{flex:1;padding:8px;border-radius:16px;color:var(--hint);font-weight:500}
.seg button.on{background:var(--ac);color:var(--act)}
.bar{margin:0 0 16px}
.bar .t{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.bar .t span{color:var(--hint)}
.bar .tr{height:10px;background:var(--line);border-radius:5px;margin-top:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:5px}
.tot{display:flex;justify-content:space-between;font-weight:700;padding:2px 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.cp{color:var(--ac);padding:8px 4px}
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(92%,420px);display:flex;gap:4px;padding:6px;border-radius:32px;z-index:5}
#tabs button{position:relative;z-index:1;flex:1;padding:11px 4px;border-radius:26px;color:var(--hint);font-weight:500;transition:color .25s,scale .2s}
#tabs button:active{scale:.93}
#tabs button.on{color:var(--tx)}
.pill{position:absolute;top:6px;left:0;height:calc(100% - 12px);width:0;border-radius:26px;background:var(--field);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi),0 4px 12px var(--sh);pointer-events:none}
.pill.ready{transition:transform .5s cubic-bezier(.3,1.3,.5,1),width .5s cubic-bezier(.3,1.3,.5,1)}
.pill.go{animation:squish .5s ease-out}
@keyframes squish{40%{scale:1.1 .9}}
#tabs #th{flex:none;width:50px;font-size:20px}
#ov{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,14,30,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#ov[hidden]{display:none}
.sheet{width:min(100%,560px);padding:18px 16px max(18px,env(safe-area-inset-bottom));border-radius:30px 30px 0 0;animation:up .22s ease-out}
.sheet h2{margin:0 0 12px;font-size:18px}
.sheet label{display:block;margin-bottom:10px;color:var(--hint);font-size:14px}
.sheet label input,.sheet label select{margin-top:4px;color:var(--tx)}
.bt{display:flex;gap:8px;margin-top:14px}
.bt button{flex:1;padding:12px;border-radius:16px;background:var(--field);border:1px solid var(--edge)}
.bt .pri{background:var(--ac);border:0}
.bt .dng{color:var(--bad)}
.bt .dng.arm,.lim .x.arm{background:var(--bad);color:#fff;border-color:transparent}
.lim .x.arm{width:auto;padding:0 12px;font-size:14px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}.pill{transition:none!important;animation:none!important}}
html,body{height:100%;overflow:hidden}
#sc{position:fixed;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;--nb:max(14px,env(safe-area-inset-bottom));-webkit-mask-image:linear-gradient(#000 calc(100% - var(--nb) - 125px),transparent calc(100% - var(--nb) - 50px));mask-image:linear-gradient(#000 calc(100% - var(--nb) - 125px),transparent calc(100% - var(--nb) - 50px))}
main{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.mvw{position:relative;overflow-x:clip}
.mvw.mt{flex:1;text-align:center}
#v_e .mvw{margin:0 -16px;padding:0 16px}
.ghost{position:absolute;left:0;top:0;width:100%;pointer-events:none}
#v_e .ghost{left:16px;width:calc(100% - 32px)}
.seg{position:relative;border-radius:28px}
.seg .pill{top:4px;height:calc(100% - 8px)}
.seg button{position:relative;z-index:1;padding:11px 4px;transition:color .25s,scale .2s}
.seg button:active{scale:.93}
.seg button.on{background:none;color:var(--tx)}
</style>
</head>
<body>
<div id="sc"><main>
<header class="glass">
 <div class="mo"><button id="pv" aria-label="Предыдущий месяц">‹</button><div class="mvw mt"><div class="mvi"><h1 id="mt"></h1></div></div><button id="nx" aria-label="Следующий месяц">›</button></div>
 <div class="mvw"><div class="mvi">
  <div class="bal"><span class="lb">Баланс</span><b id="bl">0</b></div>
  <div class="sm"><span>Доходы <b id="inc">0</b></span><span>Расходы <b id="exp">0</b></span></div>
 </div></div>
</header>

<section id="v_e">
 <div class="card glass">
  <div class="add"><input id="tx" placeholder="кофе 250 или +5000 стипендия" enterkeyhint="done" autocomplete="off"><input id="dt" type="date" aria-label="Дата"></div>
  <div id="chips"></div>
  <p class="hint" id="hint">Введите трату и выберите категорию. Для дохода начните с «+» и нажмите Enter.</p>
 </div>
 <div class="mvw"><div class="mvi"><div id="list"></div></div></div>
</section>

<section id="v_l" hidden>
 <div class="card glass">
  <div class="mvw"><div class="mvi"><div id="lims"></div></div></div>
  <div class="add" style="margin:8px 0 0"><input id="nc" placeholder="Новая категория" maxlength="30" autocomplete="off"><button class="pri" id="ac">Добавить</button></div>
  <p class="hint">Лимит в месяц необязателен. Записи остаются, даже если удалить категорию.</p>
 </div>
</section>

<section id="v_r" hidden>
 <div class="seg glass"><i class="pill"></i><button data-p="w">7 дней</button><button data-p="m">Месяц</button></div>
 <div class="card glass"><div class="mvw"><div class="mvi"><div id="rep"></div></div></div></div>
 <button class="cp" id="cp">Скопировать записи месяца</button>
</section>
</main></div>

<nav id="tabs" class="glass"><i class="pill"></i><button data-t="e">Записи</button><button data-t="l">Категории</button><button data-t="r">Отчёт</button><button id="th" aria-label="Сменить тему">☾</button></nav>

<div id="ov" hidden><div class="sheet glass" role="dialog" aria-modal="true" aria-labelledby="sh">
 <h2 id="sh">Запись</h2>
 <label>Сумма<input id="ea" type="number" inputmode="decimal" min="0"></label>
 <label id="lc">Категория<select id="ec"></select></label>
 <label>Дата<input id="ed" type="date"></label>
 <label>Заметка<input id="en" maxlength="60" autocomplete="off"></label>
 <div class="bt"><button id="edl" class="dng">Удалить</button><button id="ex">Отмена</button><button id="es" class="pri">Сохранить</button></div>
</div></div>

<script>
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();try{tg.disableVerticalSwipes()}catch(e){}}
const cs=tg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9')?tg.CloudStorage:null;
// Хранилище: облако Telegram, а в обычном браузере (для проверки) localStorage
const store={
 keys:()=>new Promise(r=>cs?cs.getKeys((e,k)=>r(e?[]:k)):r(Object.keys(localStorage).filter(k=>k.startsWith('fb_')).map(k=>k.slice(3)))),
 get:ks=>new Promise(r=>{if(!ks.length)return r({});cs?cs.getItems(ks,(e,v)=>r(e?{}:v)):r(Object.fromEntries(ks.map(k=>[k,localStorage.getItem('fb_'+k)||''])))}),
 set:(k,v)=>new Promise(r=>cs?cs.setItem(k,v,()=>r()):(localStorage.setItem('fb_'+k,v),r())),
 del:k=>new Promise(r=>cs?cs.removeItem(k,()=>r()):(localStorage.removeItem('fb_'+k),r()))
};
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
const say=t=>{try{tg.showAlert(t)}catch(e){alert(t)}};
// Подтверждение двойным нажатием: работает везде, не зависит от окон Telegram
function twoTap(b,go){
 if(b.dataset.arm){clearTimeout(b._t);go();return}
 const o=b.textContent;b.dataset.arm=1;b.textContent='Точно?';b.classList.add('arm');
 b._t=setTimeout(()=>{delete b.dataset.arm;b.textContent=o;b.classList.remove('arm')},3000);
}
const buzz=()=>{try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}};

let cfg={cats:[],lim:{},v:2};
let days={},tab='e',per='m',cur=new Date(),edit=null,fresh=null;
cur.setDate(1);
const ym=()=>ymd(cur).slice(0,7);
const entries=()=>Object.entries(days).flatMap(([d,a])=>a.map((x,i)=>({d,i,t:x[0],a:x[1],c:x[2],n:x[3]})));
const month=()=>entries().filter(e=>e.d.startsWith(ym()));
const sumBy=list=>{const m={};list.filter(e=>e.t==='e').forEach(e=>m[e.c]=(m[e.c]||0)+e.a);return m};
const tooBig=a=>JSON.stringify(a).length>3900;

function theme(t){
 document.documentElement.dataset.theme=t;
 $('#th').textContent=t==='dark'?'☀':'☾';
 const c=t==='dark'?'#0a0a0b':'#e9e9ec';
 try{tg.setBackgroundColor(c);tg.setHeaderColor(c)}catch(e){}
}
theme(tg&&tg.colorScheme?tg.colorScheme:(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));

async function load(){
 const keys=await store.keys();
 const dk=keys.filter(k=>k.startsWith('d_'));
 for(let i=0;i<dk.length;i+=40){
  const part=await store.get(dk.slice(i,i+40));
  for(const k in part){try{const a=JSON.parse(part[k]);if(Array.isArray(a)&&a.length)days[k.slice(2)]=a}catch(e){}}
 }
 if(keys.includes('cfg')){
  try{
   const o=JSON.parse((await store.get(['cfg'])).cfg);
   if(o&&Array.isArray(o.cats)){
    // однократная очистка прежних категорий по умолчанию
    if(!o.v&&JSON.stringify(o.cats)===JSON.stringify(['Еда','Транспорт','Учёба','Развлечения','Подписки','Другое'])){o.cats=[];o.lim={}}
    o.v=2;o.lim=o.lim||{};cfg=o;saveCfg();
   }
  }catch(e){}
 }
 if(keys.includes('theme')){const t=(await store.get(['theme'])).theme;if(t==='dark'||t==='light')theme(t)}
 render();
}
const saveCfg=()=>store.set('cfg',JSON.stringify(cfg));
const saveDay=d=>days[d]&&days[d].length?store.set('d_'+d,JSON.stringify(days[d])):(delete days[d],store.del('d_'+d));

function parse(s){
 s=s.trim();let t='e';
 if(s[0]==='+'){t='i';s=s.slice(1).trim()}
 const m=s.match(/\d[\d\s]*(?:[.,]\d{1,2})?/);
 if(!m)return null;
 const a=parseFloat(m[0].replace(/\s/g,'').replace(',','.'));
 if(!(a>0))return null;
 return{t,a,n:s.replace(m[0],'').replace(/\s+/g,' ').trim()};
}

async function add(forceType,cat){
 const p=parse($('#tx').value);
 if(!p){$('#hint').textContent='Не вижу суммы. Пример: кофе 250';return}
 const t=forceType||p.t,c=t==='i'?'Доход':cat,d=$('#dt').value||ymd(new Date());
 const arr=(days[d]||[]).concat([[t,p.a,c,p.n]]);
 if(tooBig(arr)){say('За этот день слишком много записей.');return}
 days[d]=arr;fresh={d,i:arr.length-1};
 await saveDay(d);
 $('#tx').value='';
 $('#hint').textContent='';
 buzz();
 if(t==='e'){
  const spent=sumBy(entries().filter(e=>e.d.slice(0,7)===d.slice(0,7)))[c]||0,l=cfg.lim[c];
  if(l>0&&spent>=l)say('Лимит «'+c+'» превышен: '+fmt(spent)+' из '+fmt(l));
  else if(l>0&&spent>=l*.8)say('«'+c+'»: потрачено '+fmt(spent)+' из '+fmt(l)+' (80%+)');
 }
 render();fresh=null;
}

function openEdit(e){
 edit=e;
 const db=$('#edl');clearTimeout(db._t);delete db.dataset.arm;db.textContent='Удалить';db.classList.remove('arm');
 $('#ea').value=e.a;$('#ed').value=e.d;$('#en').value=e.n||'';
 const sel=$('#ec');sel.replaceChildren();
 const list=cfg.cats.includes(e.c)||e.t==='i'?cfg.cats:cfg.cats.concat([e.c]);
 list.forEach(c=>{const o=el('option',null,c);o.value=c;sel.append(o)});
 sel.value=e.c;
 $('#lc').hidden=e.t==='i';
 $('#sh').textContent=e.t==='i'?'Доход':'Расход';
 $('#ov').hidden=false;
}
const closeEdit=()=>{$('#ov').hidden=true;edit=null};

async function saveEdit(){
 const e=edit,a=parseFloat($('#ea').value),d=$('#ed').value||e.d;
 if(!(a>0)){say('Введите сумму больше нуля.');return}
 const row=[e.t,a,e.t==='i'?'Доход':($('#ec').value||e.c),$('#en').value.trim()];
 if(d===e.d){
  const arr=days[d].slice();arr[e.i]=row;
  if(tooBig(arr)){say('Слишком длинная запись.');return}
  days[d]=arr;await saveDay(d);
 }else{
  const dest=(days[d]||[]).concat([row]);
  if(tooBig(dest)){say('За выбранный день слишком много записей.');return}
  days[e.d].splice(e.i,1);days[d]=dest;
  await saveDay(e.d);await saveDay(d);
 }
 buzz();closeEdit();render();
}

function delEntry(){
 twoTap($('#edl'),()=>{const e=edit;days[e.d].splice(e.i,1);saveDay(e.d).then(()=>{closeEdit();render()})});
}

function render(){
 const L=month(),inc=L.filter(e=>e.t==='i').reduce((s,e)=>s+e.a,0),ex=L.filter(e=>e.t==='e').reduce((s,e)=>s+e.a,0);
 $('#mt').textContent=cur.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
 $('#inc').textContent=fmt(inc);$('#exp').textContent=fmt(ex);
 const bl=$('#bl');bl.textContent=fmt(inc-ex);bl.className=inc-ex<0?'neg':'';
 document.querySelectorAll('#tabs button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 ['e','l','r'].forEach(k=>$('#v_'+k).hidden=k!==tab);
 document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.p===per));
 movePill($('#tabs'));if(tab==='r')movePill($('.seg'));
 if(tab==='e')drawEntries(L);
 if(tab==='l')drawCats(L);
 if(tab==='r')drawReport(L);
}

function drawEntries(L){
 const ch=$('#chips');ch.replaceChildren();
 if(!cfg.cats.length){
  const b=el('button','link','Сначала добавьте категории');
  b.onclick=()=>{tab='l';render()};ch.append(b);
 }
 cfg.cats.forEach(c=>{const b=el('button',null,c);b.onclick=()=>add('e',c);ch.append(b)});
 const box=$('#list');box.replaceChildren();
 if(!L.length){box.append(el('p','empty','В этом месяце записей нет.'));return}
 L.sort((a,b)=>b.d.localeCompare(a.d)||b.i-a.i).forEach(e=>{
  const r=el('button','item'),n=el('div','n',e.n||e.c);
  n.append(el('span',null,new Date(e.d).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+' · '+e.c));
  r.append(n,el('div','a'+(e.t==='i'?' in':''),(e.t==='i'?'+':'−')+fmt(e.a)));
  r.onclick=()=>openEdit(e);box.append(r);
  if(fresh&&fresh.d===e.d&&fresh.i===e.i){fresh=null;if(!still())r.animate([{opacity:0,transform:'translateY(-14px) scale(.95)'},{opacity:1,transform:'none'}],{duration:480,easing:EASE})}
 });
}

function drawCats(L){
 const sp=sumBy(L),box=$('#lims');box.replaceChildren();
 if(!cfg.cats.length)box.append(el('p','empty','Категорий пока нет. Добавьте первую ниже.'));
 cfg.cats.forEach(c=>{
  const row=el('div','lim'),lb=el('label',null,c),i=el('input'),x=el('button','x','×');
  lb.append(el('span',null,'Потрачено в этом месяце: '+fmt(sp[c]||0)));
  i.type='number';i.inputMode='decimal';i.min='0';i.placeholder='лимит';i.value=cfg.lim[c]||'';
  i.setAttribute('aria-label','Лимит для '+c);
  i.onchange=()=>{cfg.lim[c]=Math.max(0,+i.value||0);saveCfg()};
  x.setAttribute('aria-label','Удалить категорию '+c);
  x.onclick=()=>twoTap(x,()=>{cfg.cats=cfg.cats.filter(k=>k!==c);delete cfg.lim[c];saveCfg();render()});
  row.append(lb,i,x);box.append(row);
 });
}

function drawReport(L){
 let list=L;
 if(per==='w'){const a=ymd(new Date(Date.now()-6*864e5)),b=ymd(new Date());list=entries().filter(e=>e.d>=a&&e.d<=b)}
 const sp=sumBy(list),cats=Object.keys(sp);
 if(per==='m')cfg.cats.forEach(c=>{if(cfg.lim[c]>0&&!(c in sp))cats.push(c)});
 cats.sort((a,b)=>(sp[b]||0)-(sp[a]||0));
 const box=$('#rep');box.replaceChildren();
 const total=cats.reduce((s,c)=>s+(sp[c]||0),0);
 const tot=el('div','tot');tot.append(el('span',null,'Расходы'),el('span',null,fmt(total)));box.append(tot);
 if(!cats.length){box.append(el('p','empty','За этот период расходов нет.'));return}
 cats.forEach(c=>{
  const v=sp[c]||0,l=per==='m'?cfg.lim[c]:0,b=el('div','bar'),t=el('div','t');
  t.append(el('span',null,c),el('span',null,fmt(v)+(l>0?' из '+fmt(l):'')));
  const tr=el('div','tr'),f=el('i'),r=l>0?v/l:(total?v/total:0);
  f.style.width=Math.min(100,r*100)+'%';
  f.style.background=l>0?(r>=1?'var(--bad)':r>=.8?'var(--warn)':'var(--ok)'):'var(--ac)';
  tr.append(f);b.append(t,tr);box.append(b);
 });
}

const order=['e','l','r'],EASE='cubic-bezier(.22,1,.36,1)';
const still=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
const tick=()=>{try{tg.HapticFeedback.selectionChanged()}catch(e){}};
function movePill(nav){
 const b=nav.querySelector('button.on'),p=nav.querySelector('.pill');
 if(!b||!b.offsetWidth)return;
 p.style.width=b.offsetWidth+'px';p.style.transform='translateX('+b.offsetLeft+'px)';
 if(!p.classList.contains('ready'))requestAnimationFrame(()=>requestAnimationFrame(()=>p.classList.add('ready')));
}
addEventListener('resize',()=>{movePill($('#tabs'));movePill($('.seg'))});
function squish(nav){const p=nav.querySelector('.pill');p.classList.remove('go');void p.offsetWidth;p.classList.add('go')}
function swap(elm,d){if(!still())elm.animate([{opacity:0,transform:'translateX('+d*30+'px) scale(.97)',filter:'blur(8px)'},{opacity:1,transform:'none',filter:'blur(0)'}],{duration:420,easing:EASE})}
// Смена месяца: старое содержимое (копия) уезжает, новое выезжает с противоположной стороны
function shift(n){
 const ws=[...document.querySelectorAll('.mvw')].filter(w=>w.getClientRects().length),gs=[];
 if(!still())ws.forEach(w=>{
  const src=w.firstElementChild,g=src.cloneNode(true);
  g.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));
  const ia=src.querySelectorAll('input');g.querySelectorAll('input').forEach((x,k)=>x.value=ia[k].value);
  g.classList.add('ghost');w.append(g);gs.push(g);
 });
 cur.setMonth(cur.getMonth()+n);render();tick();
 const d=n>0?1:-1,o={duration:440,easing:EASE};
 ws.forEach((w,i)=>{
  if(!gs[i])return;
  w.firstElementChild.animate([{opacity:0,transform:'translateX('+(d*80)+'px)'},{opacity:1,transform:'none'}],o);
  gs[i].animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateX('+(-d*80)+'px)'}],{duration:440,easing:EASE,fill:'forwards'}).onfinish=()=>gs[i].remove();
 });
}
document.querySelectorAll('#tabs button[data-t]').forEach(b=>b.onclick=()=>{
 const t=b.dataset.t;if(t===tab)return;
 const d=order.indexOf(t)>order.indexOf(tab)?1:-1;
 tab=t;render();tick();
 squish($('#tabs'));swap($('#v_'+t),d);
});
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
 const p=b.dataset.p;if(p===per)return;
 const d=p==='m'?1:-1;per=p;render();tick();
 squish($('.seg'));swap($('#v_r .card'),d);
});
$('#th').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';theme(t);store.set('theme',t)};
$('#pv').onclick=()=>shift(-1);
$('#nx').onclick=()=>shift(1);
$('#tx').addEventListener('keydown',e=>{
 if(e.key!=='Enter')return;
 if($('#tx').value.trim()[0]==='+')add('i');
 else $('#hint').textContent=cfg.cats.length?'Выберите категорию ниже, чтобы сохранить трату.':'Сначала добавьте категории на вкладке «Категории».';
});
$('#nc').addEventListener('keydown',e=>{if(e.key==='Enter')$('#ac').click()});
$('#ac').onclick=()=>{
 const v=$('#nc').value.trim().slice(0,30);
 if(!v||cfg.cats.includes(v))return;
 cfg.cats.push(v);$('#nc').value='';saveCfg();render();
};
$('#es').onclick=saveEdit;$('#ex').onclick=closeEdit;$('#edl').onclick=delEntry;
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeEdit()});
$('#cp').onclick=()=>{
 const s=month().sort((a,b)=>a.d.localeCompare(b.d)).map(e=>[e.d,e.t==='i'?'доход':'расход',e.c,e.a,e.n].join(';')).join('\n');
 navigator.clipboard?navigator.clipboard.writeText(s).then(()=>say('Скопировано записей: '+month().length)):say(s);
};
$('#dt').value=ymd(new Date());
load();
</script>
</body>
</html>
