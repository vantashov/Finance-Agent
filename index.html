<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Финансы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#f4f6f3);--card:var(--tg-theme-secondary-bg-color,#fff);--tx:var(--tg-theme-text-color,#1b2420);--hint:var(--tg-theme-hint-color,#76817b);--ac:var(--tg-theme-button-color,#2f7d5b);--act:var(--tg-theme-button-text-color,#fff);--ok:#2f9a6b;--warn:#d99a1f;--bad:#cf4a3d;--line:rgba(127,127,127,.22)}
@media(prefers-color-scheme:dark){:root{--bg:var(--tg-theme-bg-color,#14191a);--card:var(--tg-theme-secondary-bg-color,#1e2526);--tx:var(--tg-theme-text-color,#edf1ee);--hint:var(--tg-theme-hint-color,#8b9691)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mo{display:flex;align-items:center;justify-content:space-between}
.mo button{font-size:26px;width:44px;height:44px;border-radius:12px}
h1{font-size:17px;margin:0;font-weight:600;text-transform:capitalize}
.bal{text-align:center;padding:10px 0 4px}
.bal .lb{display:block;color:var(--hint);font-size:14px}
.bal b{font-size:40px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bal b.neg{color:var(--bad)}
.sm{display:flex;justify-content:center;gap:22px;color:var(--hint);font-size:14px;padding-bottom:12px}
.sm b{color:var(--tx);font-variant-numeric:tabular-nums}
#tabs{display:flex;gap:4px;background:var(--card);border-radius:14px;padding:4px;margin-bottom:14px}
#tabs button,.seg button{flex:1;padding:9px;border-radius:10px;color:var(--hint);font-weight:500}
#tabs button.on,.seg button.on{background:var(--ac);color:var(--act)}
.seg{display:flex;gap:4px;background:var(--card);border-radius:12px;padding:4px;margin-bottom:12px;max-width:260px}
input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.add{display:flex;gap:8px;margin-bottom:10px}
.add input[type=date]{width:150px;flex:none}
.add button{background:var(--ac);color:var(--act);border-radius:12px;padding:0 16px;flex:none}
#chips{display:flex;flex-wrap:wrap;gap:8px}
#chips button{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:9px 14px}
#chips button:active{background:var(--ac);color:var(--act)}
.hint{color:var(--hint);font-size:14px;min-height:20px;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row .n{flex:1;min-width:0}
.row .n span{display:block;color:var(--hint);font-size:13px}
.row .a{font-variant-numeric:tabular-nums;font-weight:600}
.row .a.in{color:var(--ok)}
.empty{color:var(--hint);padding:24px 0;text-align:center}
.lim{display:flex;align-items:center;gap:12px;padding:8px 0}
.lim label{flex:1}
.lim label span{display:block;color:var(--hint);font-size:13px}
.lim input{width:130px;text-align:right}
.bar{margin:0 0 16px}
.bar .t{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.bar .t span{color:var(--hint)}
.bar .tr{height:10px;background:var(--line);border-radius:5px;margin-top:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:5px;background:var(--ok)}
.tot{display:flex;justify-content:space-between;font-weight:700;padding:6px 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.exp{margin-top:18px;color:var(--ac);padding:10px 0}
</style>
</head>
<body>
<main>
<header>
 <div class="mo"><button id="pv" aria-label="Предыдущий месяц">‹</button><h1 id="mt"></h1><button id="nx" aria-label="Следующий месяц">›</button></div>
 <div class="bal"><span class="lb">Остаток за месяц</span><b id="bl">0</b></div>
 <div class="sm"><span>Доходы <b id="inc">0</b></span><span>Расходы <b id="exp">0</b></span></div>
</header>
<nav id="tabs"><button data-t="e">Записи</button><button data-t="l">Лимиты</button><button data-t="r">Отчёт</button></nav>

<section id="v_e">
 <div class="add"><input id="tx" placeholder="кофе 250 или +5000 стипендия" enterkeyhint="done" autocomplete="off"><input id="dt" type="date" aria-label="Дата"></div>
 <div id="chips"></div>
 <p class="hint" id="hint">Введите трату и выберите категорию. Для дохода начните с «+» и нажмите Enter.</p>
 <div id="list"></div>
</section>

<section id="v_l" hidden>
 <div id="lims"></div>
 <div class="add"><input id="nc" placeholder="Новая категория" autocomplete="off"><button id="ac">Добавить</button></div>
</section>

<section id="v_r" hidden>
 <div class="seg"><button data-p="w">7 дней</button><button data-p="m">Месяц</button></div>
 <div id="rep"></div>
 <button class="exp" id="cp">Скопировать записи месяца</button>
</section>
</main>

<script>
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand()}
const cs=tg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9')?tg.CloudStorage:null;
// Хранилище: облако Telegram, а в обычном браузере (для проверки) localStorage
const store={
 keys:()=>new Promise(r=>cs?cs.getKeys((e,k)=>r(e?[]:k)):r(Object.keys(localStorage).filter(k=>k.startsWith('fb_')).map(k=>k.slice(3)))),
 get:ks=>new Promise(r=>{if(!ks.length)return r({});cs?cs.getItems(ks,(e,v)=>r(e?{}:v)):r(Object.fromEntries(ks.map(k=>[k,localStorage.getItem('fb_'+k)||''])))}),
 set:(k,v)=>new Promise(r=>cs?cs.setItem(k,v,()=>r()):(localStorage.setItem('fb_'+k,v),r())),
 del:k=>new Promise(r=>cs?cs.removeItem(k,()=>r()):(localStorage.removeItem('fb_'+k),r()))
};
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
const say=t=>tg&&tg.showAlert?tg.showAlert(t):alert(t);
const buzz=()=>{try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}};

let cfg={cats:['Еда','Транспорт','Учёба','Развлечения','Подписки','Другое'],lim:{}};
let days={},tab='e',per='m',cur=new Date();
cur.setDate(1);
const ym=()=>ymd(cur).slice(0,7);
const entries=()=>Object.entries(days).flatMap(([d,a])=>a.map((x,i)=>({d,i,t:x[0],a:x[1],c:x[2],n:x[3]})));
const month=()=>entries().filter(e=>e.d.startsWith(ym()));
const sumBy=list=>{const m={};list.filter(e=>e.t==='e').forEach(e=>m[e.c]=(m[e.c]||0)+e.a);return m};

async function load(){
 const keys=await store.keys();
 const dk=keys.filter(k=>k.startsWith('d_'));
 for(let i=0;i<dk.length;i+=40){
  const part=await store.get(dk.slice(i,i+40));
  for(const k in part){try{const a=JSON.parse(part[k]);if(Array.isArray(a)&&a.length)days[k.slice(2)]=a}catch(e){}}
 }
 if(keys.includes('cfg')){
  const c=(await store.get(['cfg'])).cfg;
  try{const o=JSON.parse(c);if(o&&o.cats)cfg=o}catch(e){}
 }
 render();
}
const saveCfg=()=>store.set('cfg',JSON.stringify(cfg));
const saveDay=d=>days[d]&&days[d].length?store.set('d_'+d,JSON.stringify(days[d])):(delete days[d],store.del('d_'+d));

function parse(s){
 s=s.trim();let t='e';
 if(s[0]==='+'){t='i';s=s.slice(1).trim()}
 const m=s.match(/\d[\d\s]*(?:[.,]\d{1,2})?/);
 if(!m)return null;
 const a=parseFloat(m[0].replace(/\s/g,'').replace(',','.'));
 if(!(a>0))return null;
 return{t,a,n:s.replace(m[0],'').replace(/\s+/g,' ').trim()};
}

async function add(forceType,cat){
 const p=parse($('#tx').value);
 if(!p){$('#hint').textContent='Не вижу суммы. Пример: кофе 250';return}
 const t=forceType||p.t;
 const c=t==='i'?'Доход':cat;
 const d=$('#dt').value||ymd(new Date());
 const arr=(days[d]||[]).concat([[t,p.a,c,p.n]]);
 if(JSON.stringify(arr).length>3900){say('За этот день слишком много записей.');return}
 days[d]=arr;
 await saveDay(d);
 $('#tx').value='';
 $('#hint').textContent=(t==='i'?'Доход':'Расход')+' записан: '+fmt(p.a)+(p.n?' — '+p.n:'');
 buzz();
 if(t==='e'){
  const spent=sumBy(entries().filter(e=>e.d.slice(0,7)===d.slice(0,7)))[c]||0,l=cfg.lim[c];
  if(l>0&&spent>=l)say('Лимит «'+c+'» превышен: '+fmt(spent)+' из '+fmt(l));
  else if(l>0&&spent>=l*.8)say('«'+c+'»: потрачено '+fmt(spent)+' из '+fmt(l)+' (80%+)');
 }
 render();
}

function remove(e){
 const go=ok=>{if(!ok)return;days[e.d].splice(e.i,1);saveDay(e.d).then(render)};
 const msg='Удалить запись «'+(e.n||e.c)+'» на '+fmt(e.a)+'?';
 tg&&tg.showConfirm?tg.showConfirm(msg,go):go(confirm(msg));
}

function render(){
 const L=month(),inc=L.filter(e=>e.t==='i').reduce((s,e)=>s+e.a,0),ex=L.filter(e=>e.t==='e').reduce((s,e)=>s+e.a,0);
 $('#mt').textContent=cur.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
 $('#inc').textContent=fmt(inc);$('#exp').textContent=fmt(ex);
 const bl=$('#bl');bl.textContent=fmt(inc-ex);bl.className=inc-ex<0?'neg':'';
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 ['e','l','r'].forEach(k=>$('#v_'+k).hidden=k!==tab);
 document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.p===per));
 if(tab==='e')drawEntries(L);
 if(tab==='l')drawLimits(L);
 if(tab==='r')drawReport(L);
}

function drawEntries(L){
 const ch=$('#chips');ch.replaceChildren();
 cfg.cats.forEach(c=>{const b=el('button',null,c);b.onclick=()=>add('e',c);ch.append(b)});
 const box=$('#list');box.replaceChildren();
 if(!L.length){box.append(el('p','empty','В этом месяце записей нет. Добавьте первую выше.'));return}
 L.sort((a,b)=>b.d.localeCompare(a.d)).forEach(e=>{
  const r=el('button','row'),n=el('div','n',e.n||e.c);
  n.append(el('span',null,new Date(e.d).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+' · '+e.c));
  r.append(n,el('div','a'+(e.t==='i'?' in':''),(e.t==='i'?'+':'−')+fmt(e.a)));
  r.onclick=()=>remove(e);box.append(r);
 });
}

function drawLimits(L){
 const sp=sumBy(L),box=$('#lims');box.replaceChildren();
 cfg.cats.forEach(c=>{
  const row=el('div','lim'),lb=el('label',null,c),i=el('input');
  lb.append(el('span',null,'Потрачено в этом месяце: '+fmt(sp[c]||0)));
  i.type='number';i.inputMode='decimal';i.min='0';i.placeholder='без лимита';i.value=cfg.lim[c]||'';
  i.onchange=()=>{cfg.lim[c]=Math.max(0,+i.value||0);saveCfg()};
  row.append(lb,i);box.append(row);
 });
}

function drawReport(L){
 let list=L,note='';
 if(per==='w'){const a=ymd(new Date(Date.now()-6*864e5)),b=ymd(new Date());list=entries().filter(e=>e.d>=a&&e.d<=b)}
 const sp=sumBy(list),cats=Object.keys(sp);
 if(per==='m')cfg.cats.forEach(c=>{if(cfg.lim[c]>0&&!(c in sp))cats.push(c)});
 cats.sort((a,b)=>(sp[b]||0)-(sp[a]||0));
 const box=$('#rep');box.replaceChildren();
 const total=cats.reduce((s,c)=>s+(sp[c]||0),0);
 const tot=el('div','tot');tot.append(el('span',null,'Расходы'),el('span',null,fmt(total)));box.append(tot);
 if(!cats.length){box.append(el('p','empty','За этот период расходов нет.'));return}
 cats.forEach(c=>{
  const v=sp[c]||0,l=per==='m'?cfg.lim[c]:0,b=el('div','bar'),t=el('div','t');
  t.append(el('span',null,c),el('span',null,fmt(v)+(l>0?' из '+fmt(l):'')));
  const tr=el('div','tr'),f=el('i');
  const r=l>0?v/l:(total?v/total:0);
  f.style.width=Math.min(100,r*100)+'%';
  f.style.background=l>0?(r>=1?'var(--bad)':r>=.8?'var(--warn)':'var(--ok)'):'var(--ac)';
  tr.append(f);b.append(t,tr);box.append(b);
 });
}

document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{per=b.dataset.p;render()});
$('#pv').onclick=()=>{cur.setMonth(cur.getMonth()-1);render()};
$('#nx').onclick=()=>{cur.setMonth(cur.getMonth()+1);render()};
$('#tx').addEventListener('keydown',e=>{
 if(e.key!=='Enter')return;
 if($('#tx').value.trim()[0]==='+')add('i');
 else $('#hint').textContent='Выберите категорию ниже, чтобы сохранить трату.';
});
$('#ac').onclick=()=>{
 const v=$('#nc').value.trim().slice(0,30);
 if(!v||cfg.cats.includes(v))return;
 cfg.cats.push(v);$('#nc').value='';saveCfg();render();
};
$('#cp').onclick=()=>{
 const s=month().sort((a,b)=>a.d.localeCompare(b.d)).map(e=>[e.d,e.t==='i'?'доход':'расход',e.c,e.a,e.n].join(';')).join('\n');
 navigator.clipboard?navigator.clipboard.writeText(s).then(()=>say('Скопировано записей: '+month().length)):say(s);
};
$('#dt').value=ymd(new Date());
load();
</script>
</body>
</html>
